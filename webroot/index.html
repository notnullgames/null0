<html>
  <head>
    <title>null0</title>
    <script type="module" src="null0-cart.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background: black;
        color: white;
        padding: 20px;
      }

      #picker {
        margin-bottom: 10px;
      }

      #picker select {
        font-size: 1em;
        padding: 4px 8px;
      }

      #demo {
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 60px);
      }

      null0-cart {
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- instead of my demo code, you could just do something like this: -->
    <!-- <null0-cart src="carts/colorbars_c.null0"></null0-cart> -->
    <div id="picker">
      <label for="cartSelect">cart: </label>
      <select id="cartSelect"></select>
    </div>
    <div id="demo"></div>
  </body>
  <script type="module">
    // Only ever instantiate ONE cart's wasm module at a time - loading every
    // built cart simultaneously (dozens of languages x simple/demo/etc) runs
    // the browser tab out of memory. #cart-name in the URL picks which one;
    // the <select> below (built from carts/list.txt) is just a friendlier
    // way to set that hash, and a plain reload on change guarantees a clean
    // re-instantiation instead of trying to tear down/reuse the old one.

    const DEFAULT_CART = 'simple_c'

    // carts/list.txt is written by `npm run carts:list`. If it's missing or
    // empty you have simply not built any carts yet - say so, rather than
    // rendering a picker full of nothing and a cart that 404s.
    const cartNames = await fetch('carts/list.txt')
      .then((r) => (r.ok ? r.text() : ''))
      .catch(() => '')
      .then((t) =>
        t
          .trim()
          .split('\n')
          .map((n) => n.trim().replace('.null0', ''))
          .filter(Boolean)
          .sort()
      )

    if (!cartNames.length) {
      document.getElementById('picker').remove()
      document.getElementById('demo').innerHTML =
        '<p>No carts built yet. Run <code>npm run carts</code> (or <code>npm run cart:simple_c</code> for just one), then reload.</p>'
      throw new Error('no carts in build/carts')
    }

    const requested = document.location.hash ? document.location.hash.slice(1) : DEFAULT_CART
    const current = cartNames.includes(requested) ? requested : cartNames[0]

    const select = document.getElementById('cartSelect')
    for (const name of cartNames) {
      const opt = document.createElement('option')
      opt.value = name
      opt.textContent = name
      if (name === current) opt.selected = true
      select.appendChild(opt)
    }

    select.addEventListener('change', () => {
      document.location.hash = select.value
    })

    window.addEventListener('hashchange', () => {
      // reload is required to fully tear down the previous cart's wasm instance
      document.location.reload()
    })

    document.getElementById('demo').innerHTML = `<null0-cart src="carts/${current}.null0"></null0-cart>`
  </script>
</html>
