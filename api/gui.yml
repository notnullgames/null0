gui_begin_window:
  args:
    title: string
    rect: Rectangle
  returns: bool
  description: Begin a GUI window. Returns false if the window is collapsed or closed - skip its contents, but still call gui_end_window.

gui_end_window:
  description: End the current GUI window.

gui_button:
  args:
    label: string
  returns: bool
  description: A button. Returns true when it is clicked.

gui_label:
  args:
    text: string
  returns: void
  description: A static text label.

gui_text:
  args:
    text: string
  returns: void
  description: A block of wrapping text.

gui_checkbox:
  args:
    label: string
    state: bool
  returns: bool
  description: A checkbox. Returns the (possibly changed) state.

gui_slider:
  args:
    value: f32
    low: f32
    high: f32
  returns: f32
  description: A slider. Returns the (possibly changed) value.

gui_layout_row:
  args:
    widths: i32[]
    numWidths: i32
    height: i32
  returns: void
  description: Set the current layout row - the column widths (negative for flexible), and the row height.

gui_end:
  description: Finish building the GUI for this frame. Called automatically at the end of update if you do not call it.

gui_draw:
  args:
    dst: Image
  returns: void
  description: Draw the GUI to an image (0 is the screen).
