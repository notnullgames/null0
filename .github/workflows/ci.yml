on:
  push:
  # a full build without burning a version number - use this before tagging if
  # you've touched a Dockerfile, a generator, or the API
  workflow_dispatch:

concurrency:
  # per-ref, not global: a tag's run builds and publishes the release, and a
  # push to main landing right after it must not cancel that
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # TODO: seperate these into different steps and remove matrix?
  host_linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          # skipped because github is being really slow about arm
          # - arch: arm64
          #   os: ubuntu-24.04-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux Host (x86_64)
        if: matrix.container == false && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglfw3 libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libwayland-dev libwayland-bin libxkbcommon-dev zip
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target host
          (cd build/host && zip ../../null0_linux_x86-64.zip null0)
      - name: Upload Linux Host (x86_64) artifact
        if: matrix.container == false && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: host_linux_x86-64
          path: null0_linux_x86-64.zip

      - name: Build Linux Hosts (arm64) - X11/Wayland and DRM
        if: matrix.container == false && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl git pkg-config cmake build-essential ninja-build zip \
            libglfw3 libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libwayland-dev libwayland-bin libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libasound2-dev libudev-dev libinput-dev clang
          # Regular (desktop) build
          cmake -B build_desktop -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DWAMR_BUILD_SIMD=0 -DWAMR_BUILD_INVOKE_NATIVE_GENERAL=1 \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-Wno-unknown-warning-option -Wno-unused-command-line-argument" \
            -DCMAKE_CXX_FLAGS="-Wno-unknown-warning-option -Wno-unused-command-line-argument"
          cmake --build build_desktop --target host
          # DRM build
          cmake -B build_drm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=DRM -DGRAPHICS=GRAPHICS_API_OPENGL_ES2 \
            -DWAMR_BUILD_SIMD=0 -DWAMR_BUILD_INVOKE_NATIVE_GENERAL=1 \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-Wno-unknown-warning-option -Wno-unused-command-line-argument" \
            -DCMAKE_CXX_FLAGS="-Wno-unknown-warning-option -Wno-unused-command-line-argument"
          cmake --build build_drm --target host
      - name: Upload  Linux Hosts (arm64) artifact
        if: matrix.container == false && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: host_linux_arm64
          path: build_desktop/host/null0
      - name: Upload  Linux Hosts (drm_arm64) artifact
        if: matrix.container == false && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: host_linux_arm64_drm
          path: build_drm/host/null0

  host_mac:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build arm64
        run: |
          cmake -B build_arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DWAMR_BUILD_SIMD=0 -DWAMR_BUILD_INVOKE_NATIVE_GENERAL=1
          cmake --build build_arm64 --target host
      - name: Build x86_64
        run: |
          cmake -B build_x86_64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DWAMR_BUILD_SIMD=0 -DWAMR_BUILD_INVOKE_NATIVE_GENERAL=1
          cmake --build build_x86_64 --target host
      - name: Create universal binary
        run: |
          mkdir -p build_universal
          lipo -create build_x86_64/host/null0 build_arm64/host/null0 -output build_universal/null0
          chmod +x build_universal/null0
          (cd build_universal && zip ../null0_macos.zip null0)
      - name: Upload Mac Host artifact
        uses: actions/upload-artifact@v4
        with:
          name: host_macos
          path: null0_macos.zip

  host_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Native Windows Host (x64)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DWAMR_BUILD_SIMD=0 -DWAMR_BUILD_INVOKE_NATIVE_GENERAL=1
          cmake --build build --target host
          Compress-Archive -Path build/host/null0.exe -DestinationPath null0_windows_x64.zip
        shell: pwsh
      - name: Upload Windows Host artifact
        uses: actions/upload-artifact@v4
        with:
          name: host_windows
          path: null0_windows_x64.zip

  host_web:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'
      - name: Build Web Host
        run: npm run host:web
      - name: Zip Web Host
        run: Compress-Archive -Path wbuild/host/null0.mjs -DestinationPath null0_web.zip
        shell: pwsh
      - name: Upload Web Host artifact
        uses: actions/upload-artifact@v4
        with:
          name: host_web
          path: null0_web.zip

  # Everything generated from api/*.yml - the bindings, host.c, API.md,
  # api.json, templates - has to be committed in sync with its generator.
  # Nothing rebuilds it at release time, so a stale file ships as-is: v0.0.13
  # went out with API.md and api.json still claiming 0.0.12, because a version
  # bump alone changes generated output.
  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate
        run: |
          npm i
          npm run gen
      - name: Check for drift
        run: |
          if ! git diff --quiet; then
            echo "::error::generated files are out of date - run 'npm run gen' and commit the result"
            git --no-pager diff --stat
            exit 1
          fi
          echo "all generated files match their generators"

  # the cart languages, straight from the registry that also generates the
  # bindings, API docs and templates (tools/lang_docs.js -> webroot/api.json).
  # A hand-written list here silently fell five languages behind; this cannot.
  #
  # Emits two matrices: one entry per language (for carts), and one per
  # language *and* architecture (for publishing), skipping arm64 for the
  # images whose toolchain is amd64-only.
  languages:
    name: Languages
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    outputs:
      langs: ${{ steps.list.outputs.langs }}
      builds: ${{ steps.list.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect cart languages
        id: list
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          node -e '
            const { languages } = require("./webroot/api.json")
            const langs = Object.values(languages)
            // carts only ever run on amd64 runners, so arm64 is a release
            // concern - building it on every push would double the work for
            // nothing
            const isTag = process.env.IS_TAG === "true"
            const builds = langs.flatMap((l) => [
              { lang: l.id, image: l.image, arch: "amd64", runner: "ubuntu-latest" },
              ...(isTag && !l.amd64Only ? [{ lang: l.id, image: l.image, arch: "arm64", runner: "ubuntu-24.04-arm" }] : [])
            ])
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" })
            out.write("langs=" + JSON.stringify(langs.map((l) => l.id)) + "\n")
            out.write("builds=" + JSON.stringify(builds) + "\n")
            console.log(`${langs.length} languages, ${builds.length} image builds`)
          '

  # Every image, pushed to this repo's package registry. Runs on every push,
  # not just tags: the carts job below builds against these, so they have to
  # exist first. One native runner per architecture (QEMU would take hours on
  # GHC); arm64 only on a tag, since carts only ever build on amd64 runners.
  images:
    name: Image (${{ matrix.image }}/${{ matrix.arch }})
    needs: languages
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.languages.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/null0-cart-${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/notnullgames/null0
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/notnullgames/null0-cart-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Stitches each language's per-arch pushes into one multi-arch tag.
  # Always tagged ci-<sha>, which is what the carts job pulls - so carts are
  # built against the images from this very run, never a previous release's.
  # A tag additionally gets the release version and `latest`.
  manifests:
    name: Manifest (${{ matrix.lang }})
    needs: [languages, images]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.languages.outputs.langs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Image name
        id: img
        run: echo "image=$(node -p "require('./webroot/api.json').languages['${{ matrix.lang }}'].image")" >> "$GITHUB_OUTPUT"
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ steps.img.outputs.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        env:
          IMAGE: ghcr.io/notnullgames/null0-cart-${{ steps.img.outputs.image }}
          VERSION: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          SHA: ${{ github.sha }}
        run: |
          cd /tmp/digests
          shopt -s nullglob
          digests=(*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "::error::no digests for ${IMAGE} - the image job must have failed"
            exit 1
          fi
          refs=$(printf "${IMAGE}@sha256:%s " "${digests[@]}")

          tags=(-t "${IMAGE}:ci-${SHA}")
          if [ "${IS_TAG}" = "true" ]; then
            # the git tag is v0.0.15; the image tag is 0.0.15
            tags+=(-t "${IMAGE}:${VERSION#v}" -t "${IMAGE}:latest")
          fi

          docker buildx imagetools create "${tags[@]}" ${refs}
          docker buildx imagetools inspect "${IMAGE}:ci-${SHA}"

  # Builds each language's carts against the image this run just published.
  # Nothing here rebuilds an image: `images` is a hard dependency, so a cart
  # can never be built against a stale one - which is how every haxe cart came
  # to be broken without CI noticing.
  carts:
    name: Carts (${{ matrix.lang }})
    needs: [languages, manifests]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.languages.outputs.langs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull this run's image
        env:
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/notnullgames/null0-cart-$(node -p "require('./webroot/api.json').languages['${{ matrix.lang }}'].image")"
          docker pull "${image}:ci-${SHA}"
          # the cart:* npm scripts refer to :latest, so point that at what we
          # just pulled rather than teaching every script about the sha
          docker tag "${image}:ci-${SHA}" "${image}:latest"
      - name: Build ${{ matrix.lang }} carts
        run: npx -y npm-run-all --parallel 'cart:*_${{ matrix.lang }}'
      - name: Upload ${{ matrix.lang }} cart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carts_${{ matrix.lang }}
          path: build/carts/*_${{ matrix.lang }}.null0

  # this creates a release on any tag, and attaches all the artifacts to it, then uploads demo page
  release:
    name: Release Tag
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - carts
      - manifests
      - host_linux
      - host_mac
      - host_windows
      - host_web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Fetch only the release assets. Downloading *everything* also pulled the
      # 41 digest artifacts - one empty file each, bookkeeping for the manifest
      # job - and the download failed outright on the volume.
      - name: Download cart artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: carts_*
          path: artifacts
      - name: Download host artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: host_*
          path: artifacts
      - run: ls -al artifacts
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
      - name: Setup website
        run: |
          cd webroot
          unzip -j ../artifacts/host_web/null0_web.zip -d .
          mkdir -p carts
          mv ../artifacts/carts_*/*.null0 carts/
          cd carts
          ls *.null0 > list.txt
      - name: Check images are pullable
        # A newly created GHCR package is private, and there is no API to make
        # it public - so this is the one manual step in a release. Rather than
        # list all 23 every time, ask the registry anonymously (no token, which
        # is exactly what a user has) and name only the ones that are unreachable.
        run: |
          {
            echo "## Cart images"
            echo ""
            broken=0
            for image in $(node -p "[...new Set(Object.values(require('./webroot/api.json').languages).map((l) => l.image))].sort().join(' ')"); do
              repo="notnullgames/null0-cart-${image}"
              token=$(curl -sf "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).token||''}catch(e){''}" || true)
              code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${token}" \
                -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
                "https://ghcr.io/v2/${repo}/manifests/latest" || true)
              if [ "${code}" != "200" ]; then
                broken=$((broken + 1))
                echo "- :lock: [null0-cart-${image}](https://github.com/orgs/notnullgames/packages/container/null0-cart-${image}/settings) - **private** (HTTP ${code}), Danger Zone -> Change package visibility"
              fi
            done
            if [ "${broken}" -eq 0 ]; then
              echo ":white_check_mark: all images are public and pullable."
            else
              echo ""
              echo "**${broken}** image(s) above are private, so \`docker run\` fails for everyone else."
              echo "Note this is *package* visibility, not the \`cart_*\` repository's."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'webroot'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A tag should update everything, and the docs site builds against null0's
  # published api.json and cart list - so it has to rebuild *after* pages went
  # out, or it would fetch the previous release's data.
  docs:
    name: Rebuild docs site
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: release
    steps:
      - name: Trigger notnullgames build
        env:
          GH_TOKEN: ${{ secrets.NULL0_BOT_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::NULL0_BOT_TOKEN not set - rebuild the docs site by hand (Actions -> Publish Site -> Run workflow)"
            exit 0
          fi
          # github-pages can serve a stale api.json for a few minutes; the docs
          # build fetches it, so give the CDN a moment before kicking it off
          sleep 60
          gh workflow run 'Publish Site' --repo notnullgames/notnullgames --ref main
          echo "triggered a docs rebuild for ${{ github.ref_name }}"
